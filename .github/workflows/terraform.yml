name: "Terraform CI/CD"

on:
  # O gatilho automático roda apenas o Plan
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  # O gatilho manual libera o botão de Apply
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: 'ATENÇÃO: Deseja aplicar as mudanças na AWS (Terraform Apply)?'
        required: true
        type: boolean
        default: false

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Plan
        run: terraform plan -no-color

      # Esta etapa AGORA SÓ RODA se você apertar o botão no GitHub e marcar "True"
      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_apply == true
        run: terraform apply -auto-approve -input=false
